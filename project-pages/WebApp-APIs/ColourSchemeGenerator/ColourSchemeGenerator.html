    </head>
    <body>
        <nav class = "container">

                <input type="color" id="colorPicker" value="#ff0000"></input>
                <select class="colour-mode">
                    <option>Monochrome</option>
                    <option>Monochrome-dark</option>
                    <option>Monochrome-light</option>
                    <option>Analogic</option>
                    <option>Complement</option>

        <div class="colorSchemeContainer">

            <div id="Sec4" class="Section"></div>

        <footer>
            <a href="../index.html">Return to Index</a>
